name: Test

# The promised `test` action: run the kit's headless tests on every push, so a
# change that breaks the contract is caught immediately.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
      - name: Run tests
        run: node test-node.js

      # A README number is a claim. This fails the build when it drifts.
      - name: Check the README's claims
        run: node tools/check-claims.js

      # The other half of the QR proof: compare the encoder against segno, an
      # independent implementation. The node suite reads the kit's own symbols
      # back, which cannot catch a table that is wrong in the same way twice.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: "3.12"

      - name: Install segno
        run: pip install --quiet segno

      - name: Verify the QR encoder against segno
        run: python3 scripts/verify-qr.py
